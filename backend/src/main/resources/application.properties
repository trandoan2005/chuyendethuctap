# Cấu hình kết nối Database MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/banquet_booking_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# JWT Secret Key (32 chars minimum)
jwt.secret=lumina-banquet-booking-super-secret-key-2026
jwt.expiration=86400000

# Tắt thông báo thừa
logging.level.org.springframework.security=WARN
